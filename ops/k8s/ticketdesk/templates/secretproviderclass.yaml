{{- if .Values.azure.keyVault.enabled }}
# Key Vault -> files under /mnt/kv in the web pod (Secrets Store CSI driver, AKS add-on, rotation poll 2 min), and the two
# string secrets synced into the Kubernetes secret td-kv for environment variables. The certificate is fetched as a
# secret: private key + chain in one PEM file, which Kestrel re-reads when the driver rewrites it (Tls:CertificatePath).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: td-kv
  labels: {{- include "td.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "azure.keyVault.csiIdentityClientId" .Values.azure.keyVault.csiIdentityClientId | quote }}
    keyvaultName: {{ required "azure.keyVault.name" .Values.azure.keyVault.name | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.azure.keyVault.certificateName }}
          objectType: secret
          objectAlias: tls.pem
        - |
          objectName: {{ .Values.azure.keyVault.appInsightsSecret }}
          objectType: secret
          objectAlias: appinsights-connection-string
        - |
          objectName: {{ .Values.azure.keyVault.attachmentsSecret }}
          objectType: secret
          objectAlias: attachments-connection
  secretObjects:
    - secretName: td-kv
      type: Opaque
      data:
        - { objectName: appinsights-connection-string, key: appinsights-connection-string }
        - { objectName: attachments-connection, key: attachments-connection }
{{- end }}
