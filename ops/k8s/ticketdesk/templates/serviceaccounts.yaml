{{- range $sa := list "td-web" "td-worker" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels: {{- include "td.labels" $ | nindent 4 }}
  {{- if $.Values.azure.workloadIdentity }}
  annotations:
    azure.workload.identity/client-id: {{ required "azure.appClientId" $.Values.azure.appClientId | quote }}
    azure.workload.identity/tenant-id: {{ required "azure.tenantId" $.Values.azure.tenantId | quote }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- if .Values.migrate.enabled }}
# A hook like the job itself: it must exist before the pre-install/pre-upgrade job runs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: td-migrator
  labels: {{- include "td.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- if .Values.azure.workloadIdentity }}
    azure.workload.identity/client-id: {{ required "azure.migratorClientId" .Values.azure.migratorClientId | quote }}
    azure.workload.identity/tenant-id: {{ .Values.azure.tenantId | quote }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
